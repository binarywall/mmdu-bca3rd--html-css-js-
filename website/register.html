<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Website</title>
</head>

<body vlink="#3f7192" link="#3f7192" alink="red" bgcolor="#ecf8fe">
    <table width="800px" border="1" align="center" bgcolor="#edf5ff">
        <tr>
            <td colspan="4" height="60px">
                <img src="https://img.magnific.com/free-vector/v915_53876-174949.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="website header" width="100%">
            </td>
        </tr>
        <tr>
            <td colspan="4">
                <!-- 
                    direction (left, right, up, down). 
                    behavior  (scroll, slide, alternate)
                    scrollamount -  Sets the speed of the animation in pixels.
                    loop: Specifies how many times the animation runs before stopping (default is infinite).
                    bgcolor: Changes the background color of the scrolling zone
                -->
                <marquee behavior="alternate" direction="left" scrollamount="10px" bgcolor="#3f7192">
                    <font color="white">This is website for small project using only HTML Tags !</font>
                </marquee>
            </td>
        </tr>
        <tr>
            <th><a href="home.html">Home</a></th>
            <th><a href="multimediaTag.html">Multi Media Tag</a></th>
            <th><a href="register.html">Register</a></th>
            <th><a href="contactus.html">Contact Us</a></th>
        </tr>
        <tr>
            <td colspan="4" height="600px">
                <form action="display.html" method="get">
                    <table border="0" cellpadding="10"   cellspacing="0" align="center">
                        <tr>
                            <th colspan="2">Student Registration Form</th>
                        </tr>
                        <tr>
                            <td>
                                <label for="name">Full Name:</label>
                            </td>
                            <td>
                                <input type="text" name="name" id="name" placeholder="Enter your name" required pattern="[A-Za-z ]{3,50}">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="email">Email:</label>
                            </td>
                            <td>
                                <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="password">Password:</label>
                            </td>
                            <td>
                                <input type="password" name="password" id="password" placeholder="Enter password" required minlength="8" maxlength="20">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="contact">Contact Number:</label>
                            </td>
                            <td>
                                <input type="number" name="contact" id="contact" placeholder="Enter contact number" required min="1000000000" max="9999999999">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label>Gender:</label>
                            </td>
                            <td>
                                <input type="radio" name="gender" id="male" value="Male" required>
                                <label for="male">Male</label>

                                <input type="radio" name="gender" id="female" value="Female">
                                <label for="female">Female</label>

                                <input type="radio" name="gender" id="other" value="Other">
                                <label for="other">Other</label>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label>Skills:</label>
                            </td>
                            <td>
                                <input type="checkbox" name="skills" id="html" value="HTML">
                                <label for="html">HTML</label>

                                <input type="checkbox" name="skills" id="css" value="CSS">
                                <label for="css">CSS</label>

                                <input type="checkbox" name="skills" id="javascript" value="JavaScript">
                                <label for="javascript">JavaScript</label>

                                <input type="checkbox" name="skills" id="python" value="Python">
                                <label for="python">Python</label>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="course">Course:</label>
                            </td>
                            <td>
                                <select name="course" id="course" required>
                                    <option value="">-- Select Course --</option>
                                    <option value="BCA">BCA</option>
                                    <option value="MCA">MCA</option>
                                    <option value="B.Tech">B.Tech</option>
                                    <option value="M.Tech">M.Tech</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="dob">Date of Birth:</label>
                            </td>
                            <td>
                                <input type="date" name="dob" id="dob" required min="1990-01-01" max="2010-12-31">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="age">Age:</label>
                            </td>
                            <td>
                                <input type="number" name="age" id="age" required min="18" max="60"
                                    placeholder="18 - 60">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="address">Address:</label>
                            </td>
                            <td>
                                <textarea name="address" id="address" rows="5" cols="30"
                                    placeholder="Enter your address" required minlength="10" maxlength="200"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="photo">Profile Photo:</label>
                            </td>
                            <td>
                                <input type="file" name="photo" id="photo" accept=".jpg,.jpeg,.png" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="terms">Terms & Conditions:</label>
                            </td>
                            <td>
                                <input type="checkbox" name="terms" id="terms" value="accepted" required>
                                <label for="terms">
                                    I agree to the terms and conditions
                                </label>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Register">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
        <tr>
            <th colspan="4">
                <p>
                    <font color="#497b9b">BCA - 3rd | Web Technology - 2026 | B-302, 307</font>
                </p>
            </th>
        </tr>
    </table>
</body>

</html>
