<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js - Day 01</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            background: radial-gradient(#480d35, #17151d);
        }

        #rotate {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            flex-direction: column;
        }

        .text {
            text-align: center;
            margin: 5px;
        }

        .text h2 {
            font-size: 2rem;
            font-weight: 500;
            color: #f6d8d5;
        }

        .text p {
            font-size: 1.5rem;
            color: #b393d3;
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .card {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.07);
        }

        .rotateX {
            animation: rotateX 5s ease-in-out infinite alternate-reverse;
        }

        .rotateY {
            animation: rotateY 5s ease-in-out infinite alternate-reverse;
        }

        .rotate {
            animation: rotate 5s ease-in-out infinite alternate-reverse;
        }

        @keyframes rotateX {
            0% {
                transform: none;
            }

            100% {
                transform: rotateX(360deg);
            }
        }

        @keyframes rotateY {
            0% {
                transform: none;
            }

            100% {
                transform: rotateY(360deg);
            }
        }

        @keyframes rotate {
            0% {
                transform: none;
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        article{
            margin: 50px auto;
            width: 200px;
            position: relative;
            transition: all 0.3s ease;
        }
        article img:first-child{
            width: 100%;
            box-shadow: 0px 10px 15px -3px rgba(233,233,233,0.5);
            border-radius: 8px;
            object-fit: cover;
            transition: all 0.3s ease;
        }
        article img:last-child{
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            right: 0;
            margin: auto;
            transform: translateY(25%);
            opacity: 0;
            transition: all 0.3s ease;
        }
        article:hover img:first-child{
            transform: perspective(250px) rotateX(40deg) translateY(-5%) translateZ(0);
        }
        
        article:hover img:last-child{
            opacity: 1;
            transform: translateY(10px);
        }
    </style>
    <script>
        let a = 1;
        console.log(a);
    </script>

</head>

<body>
    <section id="rotate">
        <div class="text">
            <h2>Rotate with Perspective</h2>
        </div>
        <div class="card-container">
            <div class="card rotateX"></div>
            <div class="card rotateY"></div>
            <div class="card rotate"></div>
        </div>
    </section>
    <section>
        <article>
            <img src="./img/images.jpeg" >
            <img src="./img/cutOut.png" >
        </article>
    </section>
</body>

</html>
