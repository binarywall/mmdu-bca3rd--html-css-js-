
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow border-0 rounded-4">
                    
                    <!-- Header -->
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h2 class="mb-1">📝 My ToDo App</h2>
                        <p class="mb-0">Organize your daily tasks</p>
                    </div>

                    <div class="card-body p-4">

                        <!-- Add Todo -->
                        <div class="input-group mb-4">
                            <input
                                type="text"
                                id="todo"
                                class="form-control"
                                placeholder="Enter your task..."
                            >
                            <button
                                class="btn btn-primary"
                                id="addTodo"
                                onclick="addToDo()"
                            >
                                + Add
                            </button>
                        </div>

                        <!-- Task Counter -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">My Tasks</h5>
                            <span class="badge bg-primary" id="taskCount">0 Tasks</span>
                        </div>

                        <!-- Todo List -->
                        <ul id="todolist" class="list-group"></ul>

                        <!-- Empty Message -->
                        <p id="emptyMessage" class="text-center text-secondary mt-4">
                            No tasks yet. Add your first task!
                        </p>

                    </div>

                    <div class="card-footer text-center text-secondary bg-white py-3">
                        Stay productive! 🚀
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        let ulList = document.getElementById("todolist");
        let todoInput = document.getElementById("todo");
        let taskCount = document.getElementById("taskCount");
        let emptyMessage = document.getElementById("emptyMessage");
        let addButton = document.getElementById("addTodo");

        let todoArray = [];
        let editIndex = -1;

        // ADD TODO
        function addToDo() {
            let todo = todoInput.value.trim();

            if (todo === "") {
                alert("Please enter a task!");
                return;
            }

            // Update existing task
            if (editIndex !== -1) {
                todoArray[editIndex].text = todo;
                editIndex = -1;

                addButton.textContent = "+ Add";
                addButton.classList.replace("btn-success", "btn-primary");
            } else {
                // Add new task
                todoArray.push({
                    text: todo,
                    done: false
                });
            }

            todoInput.value = "";
            displayTodos();
        }

        // DISPLAY TODOS
        function displayTodos() {
            ulList.innerHTML = "";

            todoArray.forEach(function (todo, index) {
                let li = document.createElement("li");

                li.className =
                    "list-group-item d-flex justify-content-between align-items-center gap-2 py-3";

                // Task text
                let taskText = document.createElement("span");
                taskText.textContent = todo.text;
                taskText.className = "text-break me-auto";

                if (todo.done) {
                    taskText.classList.add(
                        "text-decoration-line-through",
                        "text-success"
                    );
                }

                li.appendChild(taskText);

                // Button container
                let buttonGroup = document.createElement("div");
                buttonGroup.className = "d-flex gap-1 flex-shrink-0";

                // DONE / UNDO BUTTON
                let doneBtn = document.createElement("button");
                doneBtn.textContent = todo.done ? "Undo" : "Done";
                doneBtn.className = todo.done
                    ? "btn btn-sm btn-outline-secondary"
                    : "btn btn-sm btn-outline-success";

                doneBtn.onclick = function () {
                    markDone(index);
                };

                buttonGroup.appendChild(doneBtn);

                // EDIT BUTTON
                let editBtn = document.createElement("button");
                editBtn.textContent = "Edit";
                editBtn.className = "btn btn-sm btn-outline-primary";

                editBtn.onclick = function () {
                    editTodo(index);
                };

                buttonGroup.appendChild(editBtn);

                // DELETE BUTTON
                let deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.className = "btn btn-sm btn-outline-danger";

                deleteBtn.onclick = function () {
                    deleteTodo(index);
                };

                buttonGroup.appendChild(deleteBtn);
                li.appendChild(buttonGroup);
                ulList.appendChild(li);
            });

            // Update task counter
            let completed = todoArray.filter(function (todo) {
                return todo.done;
            }).length;

            taskCount.textContent =
                todoArray.length + " Tasks (" + completed + " Done)";

            // Show / hide empty message
            emptyMessage.style.display =
                todoArray.length === 0 ? "block" : "none";
        }

        // MARK DONE / UNDONE
        function markDone(index) {
            todoArray[index].done = !todoArray[index].done;
            displayTodos();
        }

        // EDIT TODO
        function editTodo(index) {
            todoInput.value = todoArray[index].text;
            editIndex = index;

            addButton.textContent = "Update";
            addButton.classList.replace("btn-primary", "btn-success");

            todoInput.focus();
        }

        // DELETE TODO
        function deleteTodo(index) {
            if (confirm("Are you sure you want to delete this task?")) {
                todoArray.splice(index, 1);

                // Cancel edit if the task being edited is deleted
                if (editIndex === index) {
                    editIndex = -1;
                    todoInput.value = "";
                    addButton.textContent = "+ Add";
                    addButton.classList.replace(
                        "btn-success",
                        "btn-primary"
                    );
                } else if (editIndex > index) {
                    editIndex--;
                }

                displayTodos();
            }
        }

        // ADD TASK WITH ENTER KEY
        todoInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addToDo();
            }
        });

        // Initial display
        displayTodos();
    </script>

</body>
</html>
