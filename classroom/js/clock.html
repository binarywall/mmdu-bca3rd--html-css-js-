<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
</head>

<body>
    <h1 id="clock"></h1>
    <button onclick="startTimer()">Start Timer</button>
    <button onclick="stopTimer()">Stop Timer</button>

    <p id="demo"></p>
    <script>
        let clock = document.getElementById("clock");
         let colors = [
            "#FF5733",
            "#3498DB",
            "#2ECC71",
            "#F1C40F",
            "#9B59B6",
            "#E91E63",
            "#1ABC9C",
            "#34495E",
            "#E67E22",
            "#95A5A6",
            "#D35400",
            "#8E44AD",
            "#16A085",
            "#2980B9",
            "#C0392B"
        ];
        let i=0;
        setInterval(() => {
            let time = new Date();
                document.children[0].children[1].style.backgroundColor = colors[i]
                 i = (i + 1) % colors.length;
                // i++;
                clock.textContent = time.toLocaleTimeString();
        }, 1000)

        let timer;
       

        function startTimer() {
            timer = setTimeout(function () {
                // console.log()

                document.getElementById("demo").innerHTML = "Finished";
            }, 1000);
        }

        function stopTimer() {
            clearTimeout(timer);
            document.getElementById("demo").innerHTML = "Timer stopped";
        }

        // Function to display any text
        function myDisplayer(text) {
            let demo = document.getElementById("demo");
            demo.innerHTML += text + "<br>";
        }
    </script>
</body>

</html>
