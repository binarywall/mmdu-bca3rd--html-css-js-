
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
</head>
<body>

    <h2>My ToDo App</h2>

    <input
        type="text"
        id="todo"
        placeholder="Type your Todo"
    >

    <button id="addTodo" onclick="addToDo()">Add Todo</button>

    <h4>Todo List</h4>

    <ul id="todolist"></ul>

    <script>
        let ulList = document.getElementById("todolist");
        let todoArray = [];

        // ADD TODO
        function addToDo() {
            let todoText = document.getElementById("todo");
            let todo = todoText.value.trim();

            if (todo === "") {
                alert("Please enter a todo!");
                return;
            }

            todoArray.push({
                text: todo,
                done: false
            });

            todoText.value = "";

            displayTodos();
        }

        // DISPLAY TODO LIST
        function displayTodos() {
            ulList.innerHTML = "";

            todoArray.forEach(function (todo, index) {

                let li = document.createElement("li");

                // Todo text
                let span = document.createElement("span");
                span.textContent = todo.text;

                // DONE styling
                if (todo.done) {
                    span.style.textDecoration = "line-through";
                    span.style.color = "green";
                }

                li.appendChild(span);

                // DONE BUTTON
                let doneBtn = document.createElement("button");
                doneBtn.textContent = todo.done ? "Undo" : "Done";
                doneBtn.style.marginLeft = "10px";

                doneBtn.onclick = function () {
                    markDone(index);
                };

                li.appendChild(doneBtn);

                // EDIT BUTTON
                let editBtn = document.createElement("button");
                editBtn.textContent = "Edit";
                editBtn.style.marginLeft = "5px";

                editBtn.onclick = function () {
                    editTodo(index);
                };

                li.appendChild(editBtn);

                // DELETE BUTTON
                let deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.style.marginLeft = "5px";

                deleteBtn.onclick = function () {
                    deleteTodo(index);
                };

                li.appendChild(deleteBtn);

                ulList.appendChild(li);
            });
        }

        // MARK TODO AS DONE OR UNDONE
        function markDone(index) {
            todoArray[index].done = !todoArray[index].done;

            displayTodos();
        }

        // EDIT AND UPDATE TODO
        function editTodo(index) {
            let updatedText = prompt(
                "Update your todo:",
                todoArray[index].text
            );

            if (updatedText === null) {
                return;
            }

            updatedText = updatedText.trim();

            if (updatedText === "") {
                alert("Todo cannot be empty!");
                return;
            }

            todoArray[index].text = updatedText;

            displayTodos();
        }

        // DELETE TODO
        function deleteTodo(index) {
            let confirmDelete = confirm(
                "Are you sure you want to delete this todo?"
            );

            if (confirmDelete) {
                todoArray.splice(index, 1);

                displayTodos();
            }
        }
    </script>

</body>
</html>
