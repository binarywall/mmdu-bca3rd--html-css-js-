<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <style>
        body {
            margin: 10%;
            margin-left: 20%;
            margin-right: 20%;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-body">
            <h1 id="h1">Heading 1 </h1>
            <span id="err"></span>
            <label for="n1" class="form-label mb-2">Enter 1st Number : </label>
            <input type="text" class="form-control" name="n1" id="n1">
            <label for="n2" class="form-label mb-2">Enter 2nd Number : </label>
            <input type="text" class="form-control" name="n2" id="n2">
            <label for="output" class="form-label mb-2">Output </label>
            <input type="text" class="form-control" name="output" id="output" disabled>
            <input type="button" class="btn-solid theme-inverse" value="Submit" id="btn_submit">
        </div>
    </div>

    <script>
        let h1 = window.document.getElementById("h1");
        let n1 = document.getElementById("n1");
        let n2 = document.getElementById("n2");
        let err = document.getElementById("err");
        let output = document.getElementById("output");
        let btn_submit = document.getElementById("btn_submit");

        btn_submit.addEventListener('click', () => {
            let num1 = Number(n1.value);
            let num2 = Number(n2.value);
            if (num1 <= 0 || num2 <= 0) {
                err.textContent = "Invalid Value !!!";
                err.style.color = "red";
            } else {
                err.textContent = ""
                let add = num1 + num2;
                output.value = add;
                n1.value = "";
                n2.value = "";
                console.log(add);
            }
        })

    </script>
</body>

</html>
